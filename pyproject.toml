[project]
name = "fastapi-template"
version = "0.1.0"
description = "A production-minded FastAPI template with PostgreSQL, Alembic, and SQLAdmin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5,<2",
    "asyncpg>=0.30.0,<1",
    "fastapi[standard]>=0.116.2,<1",
    "greenlet>=3.2.4,<4",
    "itsdangerous>=2.2.0,<3",
    "psycopg[binary]>=3.2.10,<4",
    "pwdlib[argon2]>=0.2.1,<1",
    "pyjwt>=2.10.1,<3",
    "pydantic>=2.11.9,<3",
    "pydantic-settings>=2.10.1,<3",
    "sqladmin>=0.31.0,<1",
    "sqlalchemy>=2.0.43,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pyright>=1.1.405,<2",
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
