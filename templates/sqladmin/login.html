{% extends "sqladmin/base.html" %}
{% block body %}
  <div class="flex h-screen items-center justify-center bg-[rgb(18,24,39)]">
    <form
      class="w-full max-w-md"
      action="{{ url_for('admin:login') }}"
      method="POST"
      autocomplete="off"
    >
      <h1 class="font-semibold">
        <span class="block text-sm text-white">Welcome back to</span>
        <span class="block text-xl text-[rgb(167,77,253)]">
          {{ admin.title }}
        </span>
      </h1>

      <hr class="my-6 border border-[rgba(255,255,255,0.1)]" />

      <div class="mb-3">
        <label class="font-semibold text-white">
          Username <span class="text-red-600">*</span>
        </label>
        {% if error %}
          <input
            name="username"
            type="text"
            class="form-control is-invalid"
            placeholder="Enter username"
            autocomplete="off"
          />
          <div class="invalid-feedback">{{ error }}</div>
        {% else %}
          <input
            name="username"
            type="text"
            class="mt-2 w-full rounded-md border border-white px-3 py-2 text-white"
            placeholder="Enter username"
            autocomplete="off"
          />
        {% endif %}
      </div>

      <div class="mb-6">
        <label class="font-semibold text-white">
          Password <span class="text-red-600">*</span>
        </label>
        <div class="input-group input-group-flat">
          {% if error %}
            <input
              name="password"
              type="password"
              class="form-control is-invalid"
              placeholder="Password"
              autocomplete="off"
            />
            <div class="invalid-feedback">{{ error }}</div>
          {% else %}
            <input
              name="password"
              type="password"
              class="mt-2 w-full rounded-md border border-white px-3 py-2 text-white"
              placeholder="Password"
              autocomplete="off"
            />
          {% endif %}
        </div>
      </div>

      <button
        type="submit"
        class="w-full rounded-md bg-[rgb(167,77,253)] py-2 font-semibold text-white"
      >
        Login →
      </button>
    </form>
  </div>
{% endblock %}
