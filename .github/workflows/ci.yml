name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  APP_ENV: test
  ADMIN_ENABLED: "false"
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/test
  SECRET_KEY: test-secret-key-that-is-at-least-32-characters
  JWT_SECRET_KEY: different-test-jwt-key-at-least-32-characters
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: test-admin-password

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run pyright

      - name: Test
        run: uv run pytest

      - name: Validate migration graph
        run: uv run alembic heads

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag fastapi-template:test .
