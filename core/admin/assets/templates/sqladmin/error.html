{% extends "sqladmin/base.html" %}
{% block body %}
<div class="flex h-screen items-center justify-center bg-[rgb(18,24,39)]">
  <div class="text-center">
    <div class="mb-8">
      <h1 class="text-9xl font-bold text-[rgb(167,77,253)]">{{ status_code }}</h1>
    </div>
    <h2 class="text-3xl font-semibold text-white mb-4">
      {% if status_code == '404' %}
        Страница не найдена
      {% elif status_code == '403' %}
        Доступ запрещён
      {% elif status_code == '500' %}
        Внутренняя ошибка сервера
      {% else %}
        Ошибка
      {% endif %}
    </h2>
    <p class="text-gray-400 mb-8 max-w-md mx-auto">{{ message }}</p>
    <div class="space-x-4">
      <a href="{{ url_for('admin:index') }}" 
         class="inline-block px-6 py-3 bg-[rgb(167,77,253)] text-white rounded-lg hover:bg-[rgb(147,51,234)] transition-colors">
        <i class="fas fa-home mr-2"></i>На главную
      </a>
      <button onclick="history.back()"
              class="px-6 py-3 bg-[rgb(30,41,59)] border border-[rgba(255,255,255,0.1)] text-white rounded-lg hover:bg-[rgba(255,255,255,0.1)] transition-colors">
        <i class="fas fa-arrow-left mr-2"></i>Назад
      </button>
    </div>
  </div>
</div>
{% endblock %}
