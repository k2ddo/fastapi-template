<!-- List Action Confirmation Modal -->
<div class="fixed inset-0 z-50 hidden overflow-y-auto" id="modal-confirmation-{{ custom_action }}" aria-labelledby="modal-confirmation-{{ custom_action }}-title" role="dialog" aria-modal="true">
  <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <!-- Background overlay -->
    <div class="fixed inset-0 bg-black bg-opacity-75 transition-opacity" aria-hidden="true" onclick="document.getElementById('modal-confirmation-{{ custom_action }}').classList.add('hidden')"></div>

    <!-- This element is to trick the browser into centering the modal contents. -->
    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

    <!-- Modal panel -->
    <div class="relative inline-block align-bottom bg-[rgb(30,41,59)] rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-[rgba(255,255,255,0.1)]">
      <div class="bg-[rgb(30,41,59)] px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
        <div class="sm:flex sm:items-start">
          <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-[rgba(167,77,253,0.2)] sm:mx-0 sm:h-10 sm:w-10">
            <i class="fas fa-question text-[rgb(167,77,253)]"></i>
          </div>
          <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
            <h3 class="text-lg leading-6 font-medium text-white" id="modal-confirmation-{{ custom_action }}-title">
              Подтверждение действия
            </h3>
            <div class="mt-2">
              <p class="text-sm text-gray-400">{{ confirmation_message }}</p>
              <p class="text-sm text-gray-500 mt-1" id="modal-confirmation-{{ custom_action }}-info"></p>
            </div>
          </div>
        </div>
      </div>
      <div class="bg-[rgb(18,24,39)] px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-[rgba(255,255,255,0.1)]">
        <button type="button" 
                id="action-custom-modal-{{ custom_action }}"
                data-url="{{ url }}"
                class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-[rgb(167,77,253)] text-base font-medium text-white hover:bg-[rgb(147,51,234)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[rgb(167,77,253)] sm:ml-3 sm:w-auto sm:text-sm transition-colors">
          <i class="fas fa-check mr-2"></i>Да
        </button>
        <button type="button" 
                onclick="document.getElementById('modal-confirmation-{{ custom_action }}').classList.add('hidden')"
                class="mt-3 w-full inline-flex justify-center rounded-md border border-[rgba(255,255,255,0.1)] shadow-sm px-4 py-2 bg-[rgb(30,41,59)] text-base font-medium text-gray-300 hover:bg-[rgba(255,255,255,0.1)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[rgb(167,77,253)] sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm transition-colors">
          Отмена
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  // Modal functionality for list action confirmation
  document.addEventListener('DOMContentLoaded', function() {
    // Show modal
    document.querySelectorAll('[data-bs-toggle="modal"][data-bs-target="#modal-confirmation-{{ custom_action }}"]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        const modal = document.getElementById('modal-confirmation-{{ custom_action }}');
        const info = document.getElementById('modal-confirmation-{{ custom_action }}-info');
        
        // Count selected items
        const selectedCount = document.querySelectorAll('.select-box:checked').length;
        if (selectedCount > 0) {
          info.textContent = `Выбрано элементов: ${selectedCount}`;
        } else {
          info.textContent = 'Не выбрано ни одного элемента';
        }
        
        modal.classList.remove('hidden');
      });
    });
    
    // Handle action button
    document.getElementById('action-custom-modal-{{ custom_action }}').addEventListener('click', function() {
      const url = this.getAttribute('data-url');
      if (url) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = url;
        
        // Add selected items
        document.querySelectorAll('.select-box:checked').forEach(function(checkbox) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'pks';
          input.value = checkbox.previousElementSibling.value;
          form.appendChild(input);
        });
        
        document.body.appendChild(form);
        form.submit();
      }
    });
  });
</script>
