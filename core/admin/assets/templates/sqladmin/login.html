{% extends "sqladmin/base.html" %}
{% block body %}
<div class="flex min-h-screen items-center justify-center bg-[rgb(18,24,39)] p-4">
  <div class="w-full max-w-md">
    <!-- Logo/Title Section -->
    <div class="text-center mb-8">
      {% if admin.logo_url %}
      <img src="{{ admin.logo_url }}" alt="Logo" class="mx-auto h-16 w-16 rounded-lg mb-4">
      {% else %}
      <div class="mx-auto h-16 w-16 rounded-lg bg-gradient-to-br from-[rgb(167,77,253)] to-[rgb(147,51,234)] flex items-center justify-center mb-4">
        <i class="fas fa-shield-alt text-2xl text-white"></i>
      </div>
      {% endif %}
      <h1 class="text-2xl font-bold text-white">Добро пожаловать</h1>
      <p class="text-gray-400 mt-2">Войдите в панель администратора</p>
    </div>

    <!-- Login Card -->
    <div class="bg-[rgb(30,41,59)] rounded-lg border border-[rgba(255,255,255,0.1)] p-8 shadow-xl">
      <form action="{{ url_for('admin:login') }}" method="POST" autocomplete="off" class="space-y-6">
        {% if error %}
        <div class="p-4 bg-red-900/20 border border-red-500/50 rounded-lg text-red-400 flex items-center">
          <i class="fas fa-exclamation-circle mr-2"></i>
          {{ error }}
        </div>
        {% endif %}

        <!-- Username Field -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-300 mb-2">
            Имя пользователя <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-user text-gray-500"></i>
            </div>
            <input
              id="username"
              name="username"
              type="text"
              required
              class="block w-full pl-10 pr-3 py-2 bg-[rgb(18,24,39)] border {% if error %}border-red-500{% else %}border-[rgba(255,255,255,0.1)]{% endif %} rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[rgb(167,77,253)] focus:border-transparent transition-all"
              placeholder="Введите имя пользователя"
              autocomplete="off"
              autofocus
            />
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
            Пароль <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-lock text-gray-500"></i>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              required
              class="block w-full pl-10 pr-10 py-2 bg-[rgb(18,24,39)] border {% if error %}border-red-500{% else %}border-[rgba(255,255,255,0.1)]{% endif %} rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[rgb(167,77,253)] focus:border-transparent transition-all"
              placeholder="Введите пароль"
              autocomplete="off"
            />
            <button type="button" 
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-300"
                    onclick="togglePassword()">
              <i id="password-icon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full flex justify-center items-center px-4 py-3 bg-gradient-to-r from-[rgb(167,77,253)] to-[rgb(147,51,234)] text-white font-medium rounded-lg hover:from-[rgb(147,51,234)] hover:to-[rgb(124,58,237)] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[rgb(167,77,253)] transform transition-all duration-200 hover:scale-[1.02]"
        >
          <span>Войти</span>
          <i class="fas fa-arrow-right ml-2"></i>
        </button>
      </form>
    </div>

  </div>
</div>

<script>
  function togglePassword() {
    const passwordInput = document.getElementById('password');
    const passwordIcon = document.getElementById('password-icon');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      passwordIcon.classList.remove('fa-eye');
      passwordIcon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      passwordIcon.classList.remove('fa-eye-slash');
      passwordIcon.classList.add('fa-eye');
    }
  }
</script>
{% endblock %}
